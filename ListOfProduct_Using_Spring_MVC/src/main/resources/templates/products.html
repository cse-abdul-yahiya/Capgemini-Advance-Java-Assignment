<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Product List</title>

<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #e3f2fd, #ffffff);
        margin: 0;
        padding: 0;
    }

    .container {
        width: 80%;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        color: #1976d2;
        margin-bottom: 30px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    thead {
        background-color: #1976d2;
        color: white;
    }

    th, td {
        padding: 12px;
        text-align: center;
    }

    th {
        font-weight: bold;
    }

    tbody tr {
        transition: 0.3s;
    }

    tbody tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    tbody tr:hover {
        background-color: #e3f2fd;
        transform: scale(1.01);
    }

    .price {
        color: #2e7d32;
        font-weight: bold;
    }

    @media (max-width: 768px) {
        .container {
            width: 95%;
        }
    }
</style>

</head>

<body>

<div class="container">
    <h1>🛒 Product List</h1>

    <table>
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Product Price</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td th:text="${product.name}"></td>
                <td class="price"
                    th:text="${#numbers.formatDecimal(product.price,1,2)}">
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
